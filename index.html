<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#3f6f5b" />
  <title>Dash</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Dash" />
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div id="app"><!-- app.js builds the UI here --></div>
  <div id="toasts"></div>

  <!-- No build step: the browser runs these files exactly as uploaded (§13.1). -->
  <script type="module" src="js/app.js"></script>
  <!-- Phone-only chrome rearrangement: keeps the core app verbs intact, but
       gives + New one designed action row and tucks utilities behind More. -->
  <script type="module" src="js/mobile-chrome.js"></script>
  <!-- Shared item-editor hierarchy: quick capture first, organisational tools
       behind one native More details disclosure on phone and desktop. -->
  <script type="module" src="js/editor-details.js"></script>

  <!-- Offline-first: register the service worker so the app shell works with
       no network (data is local anyway). (§13.2 #6) -->
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js").catch(() => {
          /* not fatal — app still works online; see console */
        });
      });
      // ---- taking on a new version without throwing away a tap ----
      //
      // When a new version of Dash takes over, we reload once so we never run
      // a mix of old and new code (which caused subtle bugs after updates).
      // That reload stays. What changed on August 15, 2026 is WHEN it is
      // allowed to happen.
      //
      // The bug: sw.js calls skipWaiting() on install and clients.claim() on
      // activate, both unconditional, so a newer worker seizes an already-open
      // tab the moment it finishes installing. Installing means fetching the
      // whole shell, which measured about two seconds after the page appeared
      // — long after Dash is on screen and tappable. Tap Projects inside that
      // window and the reload threw the navigation away and dropped you back
      // on Home, which is Dash's fixed cold-start view. It read as the app
      // refusing to go where you told it.
      //
      // The rule now: reload straight away only while nobody has touched the
      // page yet, because then there is nothing to lose. Once there has been a
      // real tap or keypress, the update waits for a quiet moment instead.
      //
      // Nothing is lost by waiting. The new worker is already active, so the
      // very next time Dash is opened it serves the new code — deferring
      // delays an update, it never skips one.
      let reloadedForUpdate = false;
      let updateWaiting = false;
      let touched = false;

      function reloadForUpdate() {
        if (reloadedForUpdate) return;
        reloadedForUpdate = true;
        window.location.reload();
      }

      // "Touched" means a deliberate act — a tap or a key. Deliberately not
      // scroll or pointer movement: reading the Home sheet is not a state you
      // can lose, and treating it as one would let a page that is merely open
      // hold an update off forever. capture:true so it is seen even if a view
      // stops the event, once:true because the first one settles the question.
      const noteTouch = () => { touched = true; };
      addEventListener("pointerdown", noteTouch, { capture: true, once: true });
      addEventListener("keydown", noteTouch, { capture: true, once: true });

      navigator.serviceWorker.addEventListener("controllerchange", () => {
        if (!touched) { reloadForUpdate(); return; }  // untouched: nothing to throw away
        updateWaiting = true;                         // busy: wait for a quiet moment
      });

      // The quiet moment. Hiding the tab covers everything that actually
      // happens on a Mac and a phone — switching apps, locking the screen,
      // moving to another tab — and by definition nobody is looking, so the
      // reload costs nothing. If it never comes, the next open picks the new
      // version up anyway.
      document.addEventListener("visibilitychange", () => {
        if (updateWaiting && document.visibilityState === "hidden") reloadForUpdate();
      });
    }
  </script>
</body>
</html>
