<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#3f6f5b" />
  <title>Dash</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Dash" />
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/app.css" />
  <link rel="stylesheet" href="css/projects.css" />
</head>
<body>
  <div id="app"><!-- app.js builds the UI here --></div>
  <div id="toasts"></div>

  <!-- No build step: the browser runs these files exactly as uploaded (§13.1). -->
  <script type="module" src="js/app.js"></script>
  <!-- Phone-only chrome rearrangement: keeps the core app verbs intact, but
       gives + New one designed action row and tucks utilities behind More. -->
  <script type="module" src="js/mobile-chrome.js"></script>
  <!-- Shared item-editor hierarchy: quick capture first, organisational tools
       behind one native More details disclosure on phone and desktop. -->
  <script type="module" src="js/editor-details.js"></script>

  <!-- Offline-first: register the service worker so the app shell works with
       no network (data is local anyway). (§13.2 #6) -->
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js").catch(() => {
          /* not fatal — app still works online; see console */
        });
      });

      // ---- taking on a new version without throwing away a navigation ----
      //
      // sw.js calls skipWaiting() + clients.claim(), so a newly-installed
      // worker can take control while this tab is already open.
      //
      // Older Dash versions reloaded immediately on controllerchange. The
      // first fix deferred that reload after a pointer/key interaction, but it
      // left one narrow race: controllerchange could arrive a fraction before
      // the first pointerdown, start the reload, and the click could still
      // switch views before that already-started reload completed. Result:
      // Projects appeared briefly, then the cold-start reload landed on Home.
      //
      // The stronger rule is simpler: A VISIBLE DASH TAB NEVER FORCE-RELOADS
      // ITSELF FOR AN UPDATE. controllerchange only records that an update is
      // waiting. The reload happens when the document is hidden — switching
      // tabs/apps, locking the device, closing the PWA — when no live action can
      // be thrown away. If the page disappears without that event, the next
      // open is already controlled by the new worker anyway.
      let reloadedForUpdate = false;
      let updateWaiting = false;

      function reloadForUpdate() {
        if (reloadedForUpdate) return;
        reloadedForUpdate = true;
        window.location.reload();
      }

      navigator.serviceWorker.addEventListener("controllerchange", () => {
        updateWaiting = true;
        // Hidden already? There is no visible interaction to protect.
        if (document.visibilityState === "hidden") reloadForUpdate();
      });

      document.addEventListener("visibilitychange", () => {
        if (updateWaiting && document.visibilityState === "hidden") {
          reloadForUpdate();
        }
      });
    }
  </script>
</body>
</html>
